name: Shared MicroPython regression

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ports_unix.yml'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'mpy-cross/**'
      - 'tools/**'
      - 'ports/unix/**'
      - 'tests/**'
      - 'ports/p2/modules/**'
      - 'ports/p2/tests/drivers/**'
      - '.gitmodules'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ports_unix.yml'
      - 'py/**'
      - 'extmod/**'
      - 'shared/**'
      - 'lib/**'
      - 'mpy-cross/**'
      - 'tools/**'
      - 'ports/unix/**'
      - 'tests/**'
      - 'ports/p2/modules/**'
      - 'ports/p2/tests/drivers/**'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: unix-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build native Unix MicroPython and mpy-cross
        run: bash tools/ci.sh unix_standard_build
      - name: Run upstream core, float and import regressions
        working-directory: tests
        run: python3 run-tests.py --test-dirs basics float import
      - name: Exercise P2 arrays on the host interpreter
        run: sh ports/p2/tests/drivers/host_mpy_array.sh ports/unix/build-standard/micropython
      - name: Compile and import portable bytecode
        run: |
          printf 'def f(n):\n    return n * n + 1\n' > "$RUNNER_TEMP/compat.py"
          mpy-cross/build/mpy-cross -s compat.py -o "$RUNNER_TEMP/compat.mpy" "$RUNNER_TEMP/compat.py"
          python3 tools/mpy-tool.py -xd "$RUNNER_TEMP/compat.mpy"
          mkdir "$RUNNER_TEMP/bytecode"
          cp "$RUNNER_TEMP/compat.mpy" "$RUNNER_TEMP/bytecode/"
          MICROPYPATH="$RUNNER_TEMP/bytecode" ports/unix/build-standard/micropython -c 'import compat; assert compat.f(29) == 842'

name: Starter kit on desktop hosts

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: p2-kit-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Package and check the starter archive
        run: |
          python -m pip install pyserial==3.5 mpremote==1.29.0
          python ports/p2/tests/test_starter.py
          python ports/p2/tests/test_pyboard_socket.py
          python ports/p2/tools/make_starter.py "kit path"
          python -m zipfile -e "kit path/micropython-p2-starter.zip" "user downloads"
      - name: Check host tools in the extracted kit
        working-directory: user downloads/micropython-p2
        run: |
          mpremote --help
          python ports/p2/tools/ram_session.py --help
          python ports/p2/tools/flash_boot.py --profile edge --check
          python -m unittest discover -s ports/p2/tests/drivers
      - name: Compile using the Linux x86-64 binary in the archive
        if: runner.os == 'Linux'
        run: python ports/p2/tests/kit_mpy.py "kit path/micropython-p2-starter.zip"

name: Starter kit on desktop hosts

on:
  workflow_dispatch:
    inputs:
      public_release:
        description: Download and test the release assets attached to the selected tag
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: p2-kit-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up host tools and run packaging tests
        run: |
          python -m pip install pyserial==3.5 mpremote==1.29.0
          python -m unittest discover -s ports/p2/tests -p "test_*.py"
      - name: Build a starter kit from the selected revision
        if: ${{ !inputs.public_release }}
        run: python ports/p2/tools/make_starter.py "kit path"
      - name: Download the selected release and check its checksum
        if: inputs.public_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            echo "Select a release tag when testing published assets." >&2
            exit 1
          fi
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "kit path" \
            --pattern micropython-p2-starter.zip --pattern SHA256SUMS.txt
          cd "kit path"
          python -c "from hashlib import sha256; from pathlib import Path; p = Path('micropython-p2-starter.zip'); assert Path('SHA256SUMS.txt').read_text().splitlines() == [sha256(p.read_bytes()).hexdigest() + '  ' + p.name], 'release checksum mismatch'"
      - name: Verify and extract the archive
        run: |
          python ports/p2/tools/make_starter.py --verify "kit path/micropython-p2-starter.zip"
          python -m zipfile -e "kit path/micropython-p2-starter.zip" "user downloads"
          python -c "from pathlib import Path; p = Path('ports/p2/firmware/manifest.json'); assert (Path('user downloads/micropython-p2') / p).read_text() == p.read_text(), 'archive manifest differs from checked-out revision'"
      - name: Check host tools in the extracted kit
        working-directory: user downloads/micropython-p2
        run: |
          mpremote --help
          python ports/p2/tools/ram_session.py --help
          python ports/p2/tests/sd_boot.py --help
          python ports/p2/tests/observe_boot.py --help
          python ports/p2/tools/flash_boot.py --profile edge --check
          python -m unittest discover -s ports/p2/tests/drivers
      - name: Compile using the Linux x86-64 binary in the archive
        if: runner.os == 'Linux'
        run: python ports/p2/tests/kit_mpy.py "kit path/micropython-p2-starter.zip"

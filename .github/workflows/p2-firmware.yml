name: Rebuild P2 firmware

on:
  workflow_dispatch:
    inputs:
      build_irq:
        description: Also build and audit opt-in IRQ Edge and Lean images from this checkout
        type: boolean
        default: false
      reproduce_release:
        description: Build the source revision in the firmware manifest and verify its images
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: rebuild-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: speccy88/tinygo-p2
          ref: fc631f268080135e7c13ad27783ee6e1bb6a1c35
          path: _sdk
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build zlib1g-dev
      - name: Select firmware source
        env:
          REPRODUCE: ${{ inputs.reproduce_release }}
        run: |
          source_dir="$GITHUB_WORKSPACE"
          if [[ "$REPRODUCE" == "true" ]]; then
            revision=$(python -c 'import json; print(json.load(open("ports/p2/firmware/manifest.json"))["source_commit"])')
            [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
            git fetch --depth=1 origin "$revision"
            source_dir="$RUNNER_TEMP/release-source"
            git worktree add --detach "$source_dir" "$revision"
            # Kit.2 froze a directory in filesystem order. Pin that build input
            # while keeping its interpreter sources, build date and Git hash.
            recipe=$(python -c 'import json; print(json.load(open("ports/p2/firmware/manifest.json")).get("frozen_manifest_commit", ""))')
            if [[ -n "$recipe" ]]; then
              [[ "$recipe" =~ ^[0-9a-f]{40}$ ]]
              git fetch --depth=1 origin "$recipe"
              git -C "$source_dir" restore --source="$recipe" --worktree -- ports/p2/manifest.py
            fi
          fi
          git -C "$source_dir" submodule update --init --depth=1 lib/micropython-lib
          echo "FIRMWARE_SOURCE=$source_dir" >> "$GITHUB_ENV"
      - name: Restore compiled P2 toolchain
        id: compiler
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/p2-sdk
          key: p2-ubuntu24-x64-fc631f268080135e7c13ad27783ee6e1bb6a1c35-${{ hashFiles('_sdk/modern/toolchain.lock.json', '_sdk/modern/patches/llvm15-p2.patch', '_sdk/modern/patches/p2llvm-tools.patch', 'ports/p2/toolchain/p2-codegen.patch', 'ports/p2/toolchain/build-overlay.sh', 'ports/p2/ci/prepare-compiler.sh') }}
      - name: Build private LLVM target on a cache miss
        if: steps.compiler.outputs.cache-hit != 'true'
        run: bash ports/p2/ci/prepare-compiler.sh _sdk/modern "$RUNNER_TEMP/p2-sdk"
      - name: Validate and build all release profiles
        id: build
        env:
          P2_WORK: ${{ runner.temp }}/p2-sdk
          P2_BIN: ${{ runner.temp }}/p2-sdk/bin
          BUILD_ROOT: ${{ runner.temp }}/p2-firmware
        run: |
          python3 ports/p2/toolchain/check-overlay.py "$P2_BIN"
          bash "$FIRMWARE_SOURCE/ports/p2/tools/build_profiles.sh" edge lean threaded
      - name: Build IRQ-enabled Edge and Lean and check their resident handlers
        if: inputs.build_irq
        env:
          P2_WORK: ${{ runner.temp }}/p2-sdk
          P2_BIN: ${{ runner.temp }}/p2-sdk/bin
          BUILD_ROOT: ${{ runner.temp }}/p2-irq
          P2_ENABLE_HW_IRQ: '1'
        run: |
          git submodule update --init --depth=1 lib/micropython-lib
          bash ports/p2/tools/build_profiles.sh edge lean
          cd ports/p2
          make -f tests/irq/Makefile -j4 BUILD="$BUILD_ROOT/native" P2_LLVM_BIN="$P2_BIN"
          for fixture in stimulus:7 bus_probe:132; do
            name=${fixture%:*}
            "$P2_BIN/clang" --target=p2 -c "tests/irq/$name.S" -o "$BUILD_ROOT/$name.o"
            python3 tools/cog_image.py pack "$BUILD_ROOT/$name.o" "$BUILD_ROOT/$name.p2d" --words "${fixture#*:}"
            cmp "tests/irq/$name.p2d" "$BUILD_ROOT/$name.p2d"
          done
      - name: Compare freshly linked release images with manifest
        if: inputs.reproduce_release
        env:
          BUILD_ROOT: ${{ runner.temp }}/p2-firmware
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path("ports/p2/firmware/manifest.json").read_text())
          differences = []
          for profile, info in manifest["profiles"].items():
              for kind, suffix in (("flat", "bin"), ("elf", "elf")):
                  image = (Path(os.environ["BUILD_ROOT"]) / profile / ("firmware." + suffix)).read_bytes()
                  expected = info[kind]
                  digest = hashlib.sha256(image).hexdigest()
                  if (digest, len(image)) != (expected["sha256"], expected["bytes"]):
                      differences.append(f"{profile}/{suffix}: reproduced {digest} ({len(image)} bytes), expected {expected}")
                  else:
                      print(f"{profile}/{suffix}: {digest} ({len(image)} bytes)")
          if differences:
              raise SystemExit("\n".join(differences))
          PY
      - name: Upload built images and linker maps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p2-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p2-firmware/*/firmware.bin
            ${{ runner.temp }}/p2-firmware/*/firmware.elf
            ${{ runner.temp }}/p2-firmware/*/firmware.elf.map
            ${{ runner.temp }}/p2-firmware/*/sections.txt
            ${{ runner.temp }}/p2-irq/*/firmware.bin
            ${{ runner.temp }}/p2-irq/*/firmware.elf
            ${{ runner.temp }}/p2-irq/*/sections.txt
            ${{ runner.temp }}/p2-irq/native/irq-native.bin
          if-no-files-found: error

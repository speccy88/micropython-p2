name: Rebuild P2 firmware

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rebuild-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: speccy88/tinygo-p2
          ref: fc631f268080135e7c13ad27783ee6e1bb6a1c35
          path: _sdk
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ninja-build zlib1g-dev
          git submodule update --init --depth=1 lib/micropython-lib
      - name: Restore compiled P2 toolchain
        id: compiler
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/p2-sdk
          key: p2-ubuntu24-x64-fc631f268080135e7c13ad27783ee6e1bb6a1c35-${{ hashFiles('_sdk/modern/toolchain.lock.json', '_sdk/modern/patches/llvm15-p2.patch', '_sdk/modern/patches/p2llvm-tools.patch', 'ports/p2/toolchain/p2-codegen.patch', 'ports/p2/toolchain/build-overlay.sh', 'ports/p2/ci/prepare-compiler.sh') }}
      - name: Build private LLVM target on a cache miss
        if: steps.compiler.outputs.cache-hit != 'true'
        run: bash ports/p2/ci/prepare-compiler.sh _sdk/modern "$RUNNER_TEMP/p2-sdk"
      - name: Validate and build all release profiles
        env:
          P2_WORK: ${{ runner.temp }}/p2-sdk
          P2_BIN: ${{ runner.temp }}/p2-sdk/bin
          BUILD_ROOT: ${{ runner.temp }}/p2-firmware
        run: |
          python3 ports/p2/toolchain/check-overlay.py "$P2_BIN"
          bash ports/p2/tools/build_profiles.sh edge lean threaded
      - name: Upload built images and linker maps
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p2-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p2-firmware/*/firmware.bin
            ${{ runner.temp }}/p2-firmware/*/firmware.elf
            ${{ runner.temp }}/p2-firmware/*/firmware.elf.map
            ${{ runner.temp }}/p2-firmware/*/sections.txt
          if-no-files-found: error
